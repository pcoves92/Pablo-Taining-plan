<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pablo Training">
<meta name="theme-color" content="#0a0a0f">
<title>Pablo — Training Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#f0f0f5;--muted:#7a7a90;--faint:#3a3a50;--gym:#4f8ef7;--gym-dim:#1a2d52;--easy:#3ecf8e;--easy-dim:#0f3324;--tempo:#f59e0b;--tempo-dim:#3b2600;--long:#818cf8;--long-dim:#1e1b4b;--hyrox:#fb7185;--hyrox-dim:#3b0f1f;--accent:#4f8ef7;--radius:14px;--radius-sm:8px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* header */
#header{padding:52px 20px 10px;flex-shrink:0;}
#header h1{font-size:21px;font-weight:800;letter-spacing:-0.5px;display:flex;align-items:center;justify-content:space-between;}
#header .sub{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:3px;}
.race-countdown{font-size:10px;font-weight:700;font-family:'DM Mono',monospace;background:rgba(245,158,11,0.15);color:#f59e0b;padding:4px 10px;border-radius:99px;border:0.5px solid rgba(245,158,11,0.3);white-space:nowrap;}

/* phase bar */
#phase-bar{margin:0 20px 10px;background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:9px 14px;flex-shrink:0;}
#phase-label{font-size:9px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;font-family:'DM Mono',monospace;}
#phase-name{font-size:12px;font-weight:700;}
#phase-note{font-size:10px;color:var(--muted);margin-top:1px;line-height:1.4;}

/* scroll */
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-height:0;}
#scroll::-webkit-scrollbar{display:none;}
.view{display:none;padding:0 20px 100px;}
.view.visible{display:block;}

/* week nav */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.wn-arrow{width:32px;height:32px;border-radius:50%;background:var(--surface);border:0.5px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;color:var(--muted);transition:all 0.15s;user-select:none;}
.wn-arrow:active{background:var(--surface2);transform:scale(0.94);}
.wn-arrow.disabled{opacity:0.25;pointer-events:none;}
.wn-label{flex:1;text-align:center;font-size:11px;font-weight:700;font-family:'DM Mono',monospace;color:var(--text);}
.wn-cur{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin-left:5px;vertical-align:middle;}

/* week strip */
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px;}
.week-day{border-radius:var(--radius-sm);padding:7px 2px;text-align:center;cursor:pointer;border:1.5px solid transparent;transition:all 0.15s;}
.week-day:active{opacity:0.7;}
.week-day .wdl{font-size:9px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;font-family:'DM Mono',monospace;margin-bottom:3px;}
.week-day .wdd{width:5px;height:5px;border-radius:50%;margin:0 auto 3px;}
.week-day .wdt{font-size:7px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;line-height:1.2;}
.week-day.thl{border-color:var(--accent);}
.week-day.sel{background:rgba(79,142,247,0.12);}

/* next session banner */
.next-banner{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;}
.next-banner:active{background:var(--surface2);}
.nb-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.nb-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:2px;}
.nb-title{font-size:13px;font-weight:700;}
.nb-meta{font-size:10px;color:var(--muted);margin-top:1px;}
.nb-arrow{color:var(--muted);font-size:16px;margin-left:auto;}

/* session cards */
.sc{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.sc-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;}
.sc-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.sc-title{font-size:17px;font-weight:800;letter-spacing:-0.3px;}
.sc-meta{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px;}
.sc-badge{display:inline-block;font-size:9px;font-weight:700;padding:3px 8px;border-radius:99px;margin-top:6px;letter-spacing:0.06em;text-transform:uppercase;font-family:'DM Mono',monospace;}

/* exercise rows */
.ex-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:10px 0;border-bottom:0.5px solid var(--border);}
.ex-row:last-child{border-bottom:none;}
.ex-name{font-size:13px;font-weight:600;line-height:1.3;}
.ex-note{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;}
.ex-tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;margin-left:4px;font-family:'DM Mono',monospace;font-weight:500;vertical-align:middle;}
.tag-hip{background:#2d1b4e;color:#c084fc;}
.tag-back{background:#3b0f0f;color:#fca5a5;}
.ex-sets{text-align:right;flex-shrink:0;}
.ex-sets-main{font-size:13px;font-weight:700;font-family:'DM Mono',monospace;white-space:nowrap;}
.ex-sets-rest{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px;}

/* run stats */
.run-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
.run-stat{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;}
.rsl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:4px;}
.rsv{font-size:13px;font-weight:700;}
.run-struct{background:var(--surface2);border-radius:var(--radius-sm);padding:12px;margin-top:8px;}
.rst-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:8px;}
.run-step{display:flex;gap:10px;padding:5px 0;font-size:12px;line-height:1.4;}
.run-step-n{width:18px;height:18px;min-width:18px;border-radius:50%;background:var(--faint);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;font-family:'DM Mono',monospace;}
.hr-box{background:rgba(239,68,68,0.1);border:0.5px solid rgba(239,68,68,0.3);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;}
.hr-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:#fca5a5;font-family:'DM Mono',monospace;margin-bottom:4px;}
.hr-text{font-size:11px;color:#fecaca;line-height:1.5;}
.key-rule{background:rgba(79,142,247,0.1);border:0.5px solid rgba(79,142,247,0.3);border-radius:var(--radius-sm);padding:10px 12px;margin-top:8px;font-size:11px;color:#93c5fd;line-height:1.5;}
.wu-box{background:rgba(62,207,142,0.08);border:0.5px solid rgba(62,207,142,0.2);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;}
.wu-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--easy);font-family:'DM Mono',monospace;margin-bottom:5px;}
.wu-text{font-size:11px;color:#a7f3d0;line-height:1.5;}
.note-box{background:rgba(245,158,11,0.08);border:0.5px solid rgba(245,158,11,0.2);border-radius:var(--radius-sm);padding:10px 12px;margin-top:10px;font-size:11px;color:#fde68a;line-height:1.5;}

/* rest day */
.rest-card{text-align:center;padding:30px 20px;}
.rest-icon{font-size:44px;margin-bottom:12px;}
.rest-title{font-size:20px;font-weight:800;margin-bottom:6px;}
.rest-sub{font-size:12px;color:var(--muted);line-height:1.5;}

/* calendar */
.month-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);font-family:'DM Mono',monospace;margin:18px 0 8px;}
.week-row{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:5px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background 0.15s;}
.week-row:active{background:var(--surface2);}
.wr-label{font-size:10px;font-weight:700;font-family:'DM Mono',monospace;color:var(--muted);min-width:85px;}
.wr-days{display:flex;gap:3px;flex:1;}
.wr-dot{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;}
.wr-arrow{color:var(--muted);font-size:13px;}
.week-row.cur{border-color:var(--accent);background:rgba(79,142,247,0.05);}

/* week detail nav */
.day-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:6px 12px;border-radius:99px;font-size:11px;font-weight:600;border:0.5px solid var(--border2);color:var(--muted);background:transparent;cursor:pointer;font-family:'Syne',sans-serif;transition:all 0.15s;}
.day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.phase-card{background:var(--surface);border:0.5px solid var(--border2);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.pc-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:3px;}
.pc-note{font-size:11px;color:var(--muted);line-height:1.5;}

/* bottom nav */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid var(--border2);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));flex-shrink:0;}
.bn-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;}
.bn-icon{font-size:20px;}
.bn-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-family:'DM Mono',monospace;color:var(--muted);transition:color 0.15s;}
.bn-tab.active .bn-label{color:var(--accent);}
.back-btn{background:var(--surface);border:0.5px solid var(--border2);color:var(--muted);padding:6px 12px;border-radius:99px;font-size:11px;font-family:'Syne',sans-serif;cursor:pointer;}
.tdot{display:inline-block;width:5px;height:5px;background:var(--accent);border-radius:50%;margin-left:5px;vertical-align:middle;}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>Pablo <span style="color:var(--accent)">Training</span> <span class="race-countdown" id="countdown"></span></h1>
    <div class="sub" id="today-str"></div>
  </div>
  <div id="phase-bar">
    <div id="phase-label">Current phase</div>
    <div id="phase-name">—</div>
    <div id="phase-note">—</div>
  </div>
  <div id="scroll">
    <div id="v-today" class="view visible"></div>
    <div id="v-calendar" class="view"></div>
    <div id="v-week" class="view"></div>
  </div>
</div>
<div id="bottom-nav">
  <div class="bn-tab active" onclick="switchTab('today')" id="bn-today"><div class="bn-icon">⚡</div><div class="bn-label">Today</div></div>
  <div class="bn-tab" onclick="switchTab('calendar')" id="bn-calendar"><div class="bn-icon">📅</div><div class="bn-label">Calendar</div></div>
  <div class="bn-tab" onclick="switchTab('week')" id="bn-week"><div class="bn-icon">📋</div><div class="bn-label">This week</div></div>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const FULL_BODY_LIGHT={name:'Full body (light)',icon:'🧘',type:'gym',meta:'Light / deload · ~45 min',color:'#4f8ef7',colorDim:'#1a2d52',
warmup:'Band pull-aparts 2×15 · Glute bridges 2×15 · Hip circles 30s each side',
exercises:[
  {name:'Machine chest press',sets:'2',reps:'10',rest:'90s',note:'Very light. Feel the muscle, not the weight.',tag:''},
  {name:'ISO lateral row or cable row',sets:'2',reps:'10',rest:'90s',note:'Light. Keep movement quality.',tag:''},
  {name:'Leg press',sets:'2',reps:'10',rest:'90s',note:'Light load. Protect legs for race day.',tag:''},
  {name:'Hip thrust',sets:'2',reps:'10',rest:'90s',note:'Always in. Keep glutes firing.',tag:'hip'},
  {name:'Face pull',sets:'2',reps:'15',rest:'60s',note:'Shoulder health.',tag:'back'},
  {name:'Pallof press',sets:'2',reps:'10 ea',rest:'60s',note:'Core protection.',tag:'back'},
],sessionNote:'Light week. Protect legs. No fatigue carried into the next hard session.'};

const REST={name:'Rest',icon:'😴',type:'rest',meta:'Full recovery',color:'#3a3a50',colorDim:'#16161f'};

function easyRun(km){
  const mins=Math.round(km*8.5);
  return{name:'Easy run',icon:'🏃',type:'run-easy',meta:`Zone 2 · ~${km} km`,color:'#3ecf8e',colorDim:'#0f3324',
  pace:'Run to HR: 130–148 bpm',effort:'Can hold full sentence',duration:`~${mins} min at zone 2`,
  hrText:'Zone 2 = 130–148 bpm. At true zone 2 your pace will be 8:30–9:30/km. That is correct.',
  steps:['5 min walk warm-up → ease into slow jog','Check HR at 5 min — if above 148 bpm slow down','Hold conversational pace throughout — full sentences only','If HR creeps above 150 bpm → slow down or walk briefly','Last 5 min: slow to walk + cool-down stretch'],
  keyRule:`Zone 2 = 130–148 bpm. Pace is irrelevant on this session — heart rate is everything.`};}

function tempoRun(sets,mins){
  const steps=['10 min easy warm-up jog — HR below 145 bpm before starting'];
  for(let i=1;i<=sets;i++){
    steps.push(`Interval ${i}: ${mins} min at 5:30–5:50/km — HR 160–172 bpm`);
    if(i<sets)steps.push('Recovery: 90s–2 min jog — let HR drop below 145 bpm');
  }
  steps.push('10 min easy cool-down jog + walk');
  return{name:'Tempo run',icon:'⚡',type:'run-tempo',meta:`${sets}×${mins} min · ~45 min total`,color:'#f59e0b',colorDim:'#3b2600',
  pace:`Tempo: 5:30–5:50/km · Recovery: HR below 145`,effort:'Comfortably hard — 3–4 words max',
  duration:`~${10+sets*(mins+2)+8} min total`,
  hrText:'Warm-up/cool-down: 130–148 bpm · Tempo intervals: 160–172 bpm · Recovery: back below 145 before next interval',
  steps,keyRule:`If 5:30/km too fast → start at 6:00/km. Complete all intervals over blowing up halfway.`};}

// ── HYROX STRENGTH (compound + hypertrophy, back/hamstring safe) ──────────────
const HYROX_STR_A={name:'Strength A — Squat/Push',icon:'🏋️',type:'gym',meta:'Compound + hypertrophy · ~65 min',color:'#4f8ef7',colorDim:'#1a2d52',
warmup:'Hip circles 30s ea · Glute bridges 2×15 · Band pull-aparts 2×15 · Ankle bounces 20s',
exercises:[
  {name:'Trap bar deadlift',sets:'4',reps:'6–8',rest:'2–3 min',note:'Hinge pattern — safer on the lower back than a barbell back squat. Drive through heels.',tag:''},
  {name:'Goblet squat (heavy DB or KB)',sets:'3',reps:'10',rest:'90s',note:'Depth to comfort — don\'t chase depth over spine position.',tag:''},
  {name:'Standing DB overhead press',sets:'3',reps:'8–10',rest:'90s',note:'Core braced — no lower-back arch, same cue as the marathon block.',tag:''},
  {name:'Incline dumbbell press',sets:'3',reps:'10',rest:'90s',note:'Controlled tempo — this is your muscle-building set.',tag:''},
  {name:'Farmers carry (heavy DB/KB)',sets:'3',reps:'40 m',rest:'90s',note:'Direct Hyrox crossover — grip and core under load, walk tall.',tag:''},
  {name:'Single-leg RDL',sets:'3',reps:'10 ea',rest:'90s',note:'Glute-dominant, hamstring-safe. Stop if you feel it in the lower back rather than the glute.',tag:'hip'},
  {name:'Pallof press',sets:'3',reps:'12 ea',rest:'60s',note:'Anti-rotation core — protects the back under sled and carry loads.',tag:'back'},
],sessionNote:'This is your muscle-building day. Compound lifts, 8–12 rep range, 1–2 reps in reserve.'};

const HYROX_STR_B={name:'Strength B — Pull/Hinge',icon:'💪',type:'gym',meta:'Compound + hypertrophy · ~65 min',color:'#4f8ef7',colorDim:'#1a2d52',
warmup:'Cat-cow 10 reps · Thoracic rotations 10 ea · Band pull-aparts 2×15 · Glute bridges 2×15',
exercises:[
  {name:'Romanian deadlift (DB or barbell)',sets:'4',reps:'8',rest:'2 min',note:'Hamstring-focused — soft knees, hinge from hips, stop at mid-shin.',tag:''},
  {name:'Chest-supported row',sets:'4',reps:'10',rest:'90s',note:'Removes strain from bent-over rowing — squeeze shoulder blades.',tag:'back'},
  {name:'Weighted walking lunge or step-up',sets:'3',reps:'8 ea',rest:'90s',note:'Direct carryover to sandbag lunges — control the descent.',tag:''},
  {name:'Sled push (moderate load, short distance)',sets:'3',reps:'20 m',rest:'2 min',note:'Strength-speed work — drive through full foot, chest over hands.',tag:''},
  {name:'Assisted pull-up or lat pulldown',sets:'3',reps:'8–10',rest:'90s',note:'Keep progressing this — reduce assistance as it gets easy.',tag:''},
  {name:'Hip thrust (bodyweight → light load)',sets:'3',reps:'12',rest:'90s',note:'Stay regressed until glutes — not lower back — are clearly doing the work.',tag:'hip'},
  {name:'Side plank',sets:'3',reps:'40s ea',rest:'45s',note:'Straight line head to heels — no hip sag.',tag:'back'},
],sessionNote:'Hip thrust is the one where your back tends to compensate — bodyweight or light load until form holds under fatigue.'};

// ── HYROX LIBRARY REFERENCE (from your Amazfit Training Library — exact block lives in-app) ──
function hyroxLibrary(name,duration,level,category,note){
  return{name,icon:'🔥',type:'hyrox-lib',meta:`${level} · ${duration} · ${category}`,color:'#fb7185',colorDim:'#3b0f1f',source:'Amazfit Training Library',note};
}
const HL_MULTISTATION=hyroxLibrary('High Intensity Multi-Station Overload','25:00','Advanced','HYROX Specific · Hybrid','Short, sharp multi-station stimulus — good for technique work early in the block, or as a light opener when you don\'t want a big fatigue hit before your next run.');
const HL_HARDCORE_GRIND=hyroxLibrary('40-Minute HYROX Hardcore Grind','40:00','Advanced','HYROX Specific · Functional','Sustained functional grind — pace it like a race. Don\'t blow up on the first two stations.');
const HL_CARDIO_DUAL=hyroxLibrary('Cardio Dual Machine & Burpees Circuit','40:00','Advanced','HYROX Specific · Cardio','SkiErg/Row engine work paired with burpees — this is where your running engine directly transfers.');
const HL_OVERALL_PRESSURE=hyroxLibrary('Overall Cardio Pressure Test','50:00','Advanced','HYROX Specific · Hybrid','Full-body pressure test blending all machines and stations — good mid-block fitness check.');
const HL_DESCENDING_LADDER=hyroxLibrary('Descending Ladder Intensity Training','50:00','Advanced','HYROX Specific · Hybrid','Ladder format keeps intensity climbing as reps drop — strong session for repeated-effort capacity.');
const HL_ENGINE_DRAIN=hyroxLibrary('60-Minute Engine Drain 500m AMRAP','60:00','Advanced','HYROX Specific · Hybrid','AMRAP format for pure engine capacity — pace conservatively in the first 20 min.');
const HL_STATION_GRAND=hyroxLibrary('60-Minute Functional Station Grand Circuit','60:00','Advanced','HYROX Specific · Hybrid','Full rotation through every station type — technique and capacity combined.');
const HL_COMPROMISED_PACE=hyroxLibrary('Compromised Pace Engine Intervals','36:00','Advanced','HYROX Specific · Hybrid','Running intervals right after short bursts of load — the exact skill Hyrox needs: holding pace when your legs are compromised.');

// ── HYROX SESSIONS WITH KNOWN BLOCK STRUCTURE (from your library screenshots) ──
const BENCHMARK_TEST={name:'Hyrox Benchmark Testing',icon:'📊',type:'hyrox',meta:'Baseline test · ~60 min',color:'#fb7185',colorDim:'#3b0f1f',source:'Coach-designed test — not from Amazfit library',
desc:'Establishes your starting numbers so we can program real loads and paces from here. Full rest between each test — this is data collection, not a workout.',
timeLimit:'~60 min with full rest',
items:[
  {name:'1 km Time Trial (run)',amount:'Time'},
  {name:'SkiErg',amount:'500 m — time'},
  {name:'Row',amount:'500 m — time'},
  {name:'Sled Push, moderate load',amount:'25 m — time'},
  {name:'Sled Pull, moderate load',amount:'25 m — time'},
  {name:'Wall Balls',amount:'Max reps in 2 min'},
  {name:'Farmers Carry, moderate DB/KB',amount:'40 m — time'},
  {name:'Burpee Broad Jumps',amount:'20 m — time'},
  {name:'Sandbag Lunges',amount:'50 m — time'},
],keyRule:'Log every number — times, loads, reps. These become your Week 6 and Week 10 comparison points.'};

const FULL_STATIONS_HALF_SIM={name:'HYROX Full Stations + Half Run Simulation',icon:'🔀',type:'hyrox',meta:'Functional · Advanced · 70:00',color:'#fb7185',colorDim:'#3b0f1f',source:'Amazfit Training Library',
desc:'Full station volume + 50% run distance (500m). Focuses on station movement quality and local muscular endurance.',
timeLimit:'01:10:00',partial:true,
items:[
  {name:'Running',amount:'500 m'},{name:'SkiErg',amount:'1.00 km'},{name:'Running',amount:'500 m'},{name:'Sled Push',amount:'50 m'},
],keyRule:'Good stepping stone before the full simulation — same station volume, half the running fatigue.'};

// ── HELPERS ───────────────────────────────────────────────────────────────────
function getPhase(id){return PHASES.find(p=>p.id===id);}
function getTodayDayIdx(){const d=new Date().getDay();return d===0?6:d-1;}
function dayColor(s){if(!s)return'#3a3a50';if(s.gym)return'#4f8ef7';const t=s.type;if(t==='gym')return'#4f8ef7';if(t==='run-easy')return'#3ecf8e';if(t==='run-tempo')return'#f59e0b';if(t==='run-long')return'#818cf8';if(t==='race')return'#f59e0b';if(t==='hyrox'||t==='hyrox-lib')return'#fb7185';return'#3a3a50';}
function dayLabel(s){if(!s)return'REST';if(s.gym)return'GYM+RUN';const t=s.type;if(t==='gym')return s.name.replace(' ','·');if(t==='run-easy')return'EASY';if(t==='run-tempo')return'TEMPO';if(t==='run-long')return'LONG';if(t==='race')return'RACE!';if(t==='hyrox'||t==='hyrox-lib')return'HYROX';return'REST';}
function shortDayLabel(s){const l=dayLabel(s);return l.substring(0,3);}

function getCurrentWeekIdx(){
  const now=new Date(); now.setHours(0,0,0,0);
  for(let i=0;i<WEEKS.length;i++){
    const s=new Date(WEEKS[i].startDate);
    const e=new Date(s); e.setDate(e.getDate()+6);
    if(now>=s&&now<=e)return i;
  }
  if(now<WEEKS[0].startDate)return 0;
  return WEEKS.length-1;
}

function daysToRace(){
  const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.ceil((RACE_DATE-now)/(1000*60*60*24));
  return diff;
}

// ── RENDER COMPONENTS ─────────────────────────────────────────────────────────
function gymCard(s){
  let html='';
  if(s.warmup)html+=`<div class="wu-box"><div class="wu-title">✓ Warm-up — non-negotiable</div><div class="wu-text">${s.warmup}</div></div>`;
  s.exercises.forEach(ex=>{
    const tag=ex.tag==='hip'?'<span class="ex-tag tag-hip">🔑 Hip</span>':ex.tag==='back'?'<span class="ex-tag tag-back">⚠ Back</span>':'';
    html+=`<div class="ex-row"><div><div class="ex-name">${ex.name}${tag}</div><div class="ex-note">${ex.note}</div></div><div class="ex-sets"><div class="ex-sets-main">${ex.sets}×${ex.reps}</div><div class="ex-sets-rest">${ex.rest}</div></div></div>`;
  });
  return`<div class="sc"><div class="sc-top"><div class="sc-icon" style="background:${s.colorDim}">${s.icon}</div><div><div class="sc-title">${s.name}</div><div class="sc-meta">${s.meta}</div><span class="sc-badge" style="background:${s.colorDim};color:${s.color}">Open Hevy to log weights</span></div></div>${html}${s.sessionNote?`<div class="note-box">${s.sessionNote}</div>`:''}</div>`;
}

function runCard(s){
  const steps=s.steps.map((st,i)=>`<div class="run-step"><div class="run-step-n">${i+1}</div><div>${st}</div></div>`).join('');
  return`<div class="sc"><div class="sc-top"><div class="sc-icon" style="background:${s.colorDim}">${s.icon}</div><div><div class="sc-title">${s.name}</div><div class="sc-meta">${s.meta}</div></div></div>
  <div class="run-stats"><div class="run-stat"><div class="rsl">HR target</div><div class="rsv" style="color:${s.color};font-size:11px">${s.pace}</div></div><div class="run-stat"><div class="rsl">Effort</div><div class="rsv" style="font-size:11px">${s.effort}</div></div><div class="run-stat" style="grid-column:1/-1"><div class="rsl">Duration</div><div class="rsv" style="color:${s.color}">${s.duration}</div></div></div>
  <div class="hr-box"><div class="hr-title">❤️ Heart rate</div><div class="hr-text">${s.hrText}</div></div>
  <div class="run-struct"><div class="rst-title">Session structure</div>${steps}</div>
  <div class="key-rule">${s.keyRule}</div></div>`;
}

function raceCard(s){
  const steps=s.steps.map((st,i)=>`<div class="run-step"><div class="run-step-n" style="background:#f59e0b;color:#000">${i+1}</div><div>${st}</div></div>`).join('');
  return`<div class="sc" style="border-color:#f59e0b;background:rgba(245,158,11,0.05)"><div class="sc-top"><div class="sc-icon" style="background:#3b2600;font-size:24px">🏅</div><div><div class="sc-title" style="color:#f59e0b">${s.name}</div><div class="sc-meta">${s.meta}</div></div></div><div class="run-struct"><div class="rst-title" style="color:#f59e0b">Race strategy</div>${steps}</div><div class="key-rule" style="border-color:#f59e0b;color:#fde68a;background:rgba(245,158,11,0.1)">${s.keyRule}</div></div>`;
}

function hyroxCard(s){
  const items=s.items.map(it=>`<div class="ex-row"><div class="ex-name">${it.name}</div><div class="ex-sets"><div class="ex-sets-main">${it.amount}</div></div></div>`).join('');
  const cont=s.partial?`<div style="font-size:11px;color:var(--muted);padding:8px 0 0;line-height:1.5">…continues through the remaining stations — open the full session in your Amazfit app for the exact order.</div>`:'';
  return`<div class="sc"><div class="sc-top"><div class="sc-icon" style="background:${s.colorDim}">${s.icon}</div><div><div class="sc-title">${s.name}</div><div class="sc-meta">${s.meta}</div><span class="sc-badge" style="background:${s.colorDim};color:${s.color}">${s.source}</span></div></div>
  <div class="note-box" style="margin-top:0">${s.desc}</div>
  <div class="run-struct"><div class="rst-title">For time${s.timeLimit?' · '+s.timeLimit:''}</div>${items}${cont}</div>
  ${s.keyRule?`<div class="key-rule">${s.keyRule}</div>`:''}</div>`;
}

function hyroxLibCard(s){
  return`<div class="sc"><div class="sc-top"><div class="sc-icon" style="background:${s.colorDim}">${s.icon}</div><div><div class="sc-title">${s.name}</div><div class="sc-meta">${s.meta}</div><span class="sc-badge" style="background:${s.colorDim};color:${s.color}">${s.source}</span></div></div>
  <div class="wu-box" style="background:rgba(245,158,11,0.08);border:0.5px solid rgba(245,158,11,0.2)"><div class="wu-title" style="color:#f59e0b">📲 Open in Amazfit app</div><div class="wu-text" style="color:#fde68a">Find "${s.name}" in Training Library → Zepp Training and follow the app's block prescription.</div></div>
  <div class="note-box">${s.note}</div></div>`;
}

function sessionCard(s){
  if(!s)return restCard();
  if(s.gym)return gymCard(s.gym)+'<div style="margin-top:10px"></div>'+runCard(s.run);
  if(s.type==='gym')return gymCard(s);
  if(s.type==='run-easy'||s.type==='run-tempo'||s.type==='run-long')return runCard(s);
  if(s.type==='hyrox')return hyroxCard(s);
  if(s.type==='hyrox-lib')return hyroxLibCard(s);
  if(s.type==='race')return raceCard(s);
  return restCard();
}

function restCard(){return`<div class="rest-card"><div class="rest-icon">😴</div><div class="rest-title">Rest day</div><div class="rest-sub">Walk only. No gym, no running.<br>This day is training.</div></div>`;}

function nextSessionBanner(wIdx,dIdx){
  // find next non-rest session
  let nw=wIdx,nd=dIdx+1;
  if(nd>6){nw++;nd=0;}
  if(nw>=WEEKS.length)return'';
  const s=WEEKS[nw].days[nd];
  if(!s||s.type==='rest'){nd++;if(nd>6){nw++;nd=0;}if(nw>=WEEKS.length)return'';}
  const ns=WEEKS[nw].days[nd];
  if(!ns||ns.type==='rest')return'';
  const col=dayColor(ns);
  const sess=ns.gym?ns.gym:ns;
  const label=DAYS[nd]+' — '+dayLabel(ns);
  return`<div class="next-banner" onclick="jumpToDay(${nw},${nd})">
    <div class="nb-icon" style="background:${sess.colorDim||'#1a2d52'}">${sess.icon||'📋'}</div>
    <div><div class="nb-label">Next session</div><div class="nb-title" style="color:${col}">${label}</div><div class="nb-meta">${sess.meta||''}</div></div>
    <div class="nb-arrow">›</div>
  </div>`;
}

function weekStripHtml(wIdx,activeDayIdx,clickable,clickFn){
  clickFn=clickFn||'handleStripClick';
  const w=WEEKS[wIdx];
  const realWeekIdx=getCurrentWeekIdx();
  const isRealWeek=wIdx===realWeekIdx;
  const todayDIdx=getTodayDayIdx();
  return`<div class="week-strip">${DAYS.map((d,i)=>{
    const s=w.days[i];const col=dayColor(s);const lbl=shortDayLabel(s);
    const isToday=isRealWeek&&i===todayDIdx;
    const isSel=i===activeDayIdx;
    return`<div class="week-day${isToday?' thl':''}${isSel?' sel':''}" style="${clickable?'cursor:pointer':''}" ${clickable?`onclick="${clickFn}(${wIdx},${i})"`:''}>
      <div class="wdl" style="color:${isToday?'#4f8ef7':isSel?'#fff':''}">${d}</div>
      <div class="wdd" style="background:${col}"></div>
      <div class="wdt" style="color:${col}">${lbl}</div>
    </div>`;
  }).join('')}</div>`;
}

// ── TODAY VIEW ────────────────────────────────────────────────────────────────
function renderToday(){
  const realWeekIdx=getCurrentWeekIdx();
  if(browseWeekIdx===null)browseWeekIdx=realWeekIdx;
  const wIdx=browseWeekIdx;
  const w=WEEKS[wIdx];
  const isRealWeek=wIdx===realWeekIdx;
  const todayDIdx=getTodayDayIdx();

  // active day: if real week, today; else day 0
  const activeDayIdx=isRealWeek?todayDIdx:0;
  const session=w.days[activeDayIdx];
  const isRestDay=!session||session.type==='rest';

  const prevDisabled=wIdx<=0;
  const nextDisabled=wIdx>=WEEKS.length-1;

  const wLabel=isRealWeek?`<span style="color:var(--muted)">Week</span> ${w.label}<span class="tdot"></span>`:`<span style="color:var(--muted)">Week</span> ${w.label}`;

  let html=`<div style="padding-top:6px">
    <div class="week-nav">
      <div class="wn-arrow${prevDisabled?' disabled':''}" onclick="changeWeek(-1)">‹</div>
      <div class="wn-label">${wLabel}</div>
      <div class="wn-arrow${nextDisabled?' disabled':''}" onclick="changeWeek(1)">›</div>
    </div>
    ${weekStripHtml(wIdx,activeDayIdx,true)}`;

  if(isRealWeek){
    const dayName=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][todayDIdx];
    html+=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:10px">${dayName} · ${w.label}</div>`;
    if(isRestDay){
      html+=nextSessionBanner(wIdx,todayDIdx);
    }
    html+=sessionCard(session);
  } else {
    html+=`<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:10px">Browsing: ${w.label}</div>`;
    html+=`<div class="day-tabs" id="browse-day-tabs">${DAYS.map((d,i)=>`<button class="day-tab${i===0?' active':''}" onclick="browseDaySelect(${wIdx},${i})">${d}</button>`).join('')}</div>`;
    html+=`<div id="browse-day-content">${sessionCard(w.days[0])}</div>`;
  }

  html+='</div>';
  document.getElementById('v-today').innerHTML=html;
}

function changeWeek(dir){
  const realWeekIdx=getCurrentWeekIdx();
  if(browseWeekIdx===null)browseWeekIdx=realWeekIdx;
  browseWeekIdx=Math.max(0,Math.min(WEEKS.length-1,browseWeekIdx+dir));
  renderToday();
}

function browseDaySelect(wIdx,dIdx){
  document.querySelectorAll('#browse-day-tabs .day-tab').forEach((b,i)=>b.classList.toggle('active',i===dIdx));
  document.getElementById('browse-day-content').innerHTML=sessionCard(WEEKS[wIdx].days[dIdx]);
}

function handleStripClick(wIdx,dIdx){
  const realWeekIdx=getCurrentWeekIdx();
  const isRealWeek=wIdx===realWeekIdx;
  if(!isRealWeek){
    browseDaySelect(wIdx,dIdx);
    // update strip highlight
    document.querySelectorAll('.week-day').forEach((el,i)=>el.classList.toggle('sel',i===dIdx));
    return;
  }
  // real week: show that day's session directly
  document.querySelectorAll('.week-day').forEach((el,i)=>el.classList.toggle('sel',i===dIdx));
  const dayName=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][dIdx];
  const labelEl=document.querySelector('#v-today [style*="text-transform: uppercase"]');
  if(labelEl)labelEl.textContent=`${dayName} · ${WEEKS[wIdx].label}`;
  // rebuild session area only
  const existing=document.querySelector('#v-today .sc, #v-today .rest-card, #v-today .next-banner');
  // simpler: re-render
  const w=WEEKS[wIdx];
  const s=w.days[dIdx];
  const isRest=!s||s.type==='rest';
  let inner=document.getElementById('v-today').innerHTML;
  // just re-render the whole thing with the selected day
  const todayDIdx=getTodayDayIdx();
  const wLabel=`<span style="color:var(--muted)">Week</span> ${w.label}<span class="tdot"></span>`;
  let html=`<div style="padding-top:6px">
    <div class="week-nav">
      <div class="wn-arrow${wIdx<=0?' disabled':''}" onclick="changeWeek(-1)">‹</div>
      <div class="wn-label">${wLabel}</div>
      <div class="wn-arrow${wIdx>=WEEKS.length-1?' disabled':''}" onclick="changeWeek(1)">›</div>
    </div>
    ${weekStripHtml(wIdx,dIdx,true)}
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:10px">${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][dIdx]} · ${w.label}</div>
    ${isRest?nextSessionBanner(wIdx,dIdx):''}
    ${sessionCard(s)}
  </div>`;
  document.getElementById('v-today').innerHTML=html;
}

function jumpToDay(wIdx,dIdx){
  selWeekIdx=wIdx;selDayIdx=dIdx;
  renderWeekDetail();
  switchTab('week',true);
}

// ── CALENDAR VIEW ─────────────────────────────────────────────────────────────
function renderCalendar(){
  let html='<div style="padding-top:6px">';
  let lastMonth='';
  WEEKS.forEach((w,i)=>{
    if(w.month!==lastMonth){html+=`<div class="month-hdr">${w.month}</div>`;lastMonth=w.month;}
    const isCur=i===getCurrentWeekIdx();
    const dots=DAYS.map((_,di)=>{const s=w.days[di];const col=dayColor(s);return`<div class="wr-dot" style="background:${col}22;color:${col}">${shortDayLabel(s).substring(0,2)}</div>`;}).join('');
    html+=`<div class="week-row${isCur?' cur':''}" onclick="openWeek(${i})">
      <div class="wr-label">${w.label}${isCur?'<span class="tdot"></span>':''}</div>
      <div class="wr-days">${dots}</div>
      <div class="wr-arrow">›</div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('v-calendar').innerHTML=html;
}

  const phase=getPhase(w.phase);
  const isCur=selWeekIdx===getCurrentWeekIdx();
  document.getElementById('v-week').innerHTML=`<div style="padding-top:6px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <button class="back-btn" onclick="switchTab('calendar')">‹ Calendar</button>
      <div style="font-size:12px;font-weight:700">${w.label}</div>
      ${isCur?'<span style="background:rgba(79,142,247,0.15);color:#4f8ef7;font-size:9px;padding:3px 8px;border-radius:99px;font-family:DM Mono,monospace;font-weight:700">THIS WEEK</span>':''}
    </div>
    <div class="phase-card" style="border-color:${phase.color}33">
      <div class="pc-title">${phase.name}</div>
      <div class="pc-note">${phase.note}</div>
    </div>
    ${weekStripHtml(selWeekIdx,selDayIdx,true,'selDay')}
    <div id="week-day-content">${sessionCard(w.days[selDayIdx])}</div>
  </div>`;
}

function selDay(i){
  selDayIdx=i;
  document.querySelectorAll('#v-week .week-day').forEach((el,j)=>el.classList.toggle('sel',j===i));
  document.getElementById('week-day-content').innerHTML=sessionCard(WEEKS[selWeekIdx].days[i]);
}

function openWeek(idx){selWeekIdx=idx;selDayIdx=0;renderWeekDetail();switchTab('week',true);}

// ── HEADER ────────────────────────────────────────────────────────────────────
function renderHeader(){
  const now=new Date();
  const ds=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const ms=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('today-str').textContent=`${ds[now.getDay()]}, ${now.getDate()} ${ms[now.getMonth()]} ${now.getFullYear()}`;
  const d=daysToRace();
  document.getElementById('countdown').textContent=d>0?`${d}d to race`:`Race day!`;
  const wIdx=getCurrentWeekIdx();
  const phase=getPhase(WEEKS[wIdx].phase);
  document.getElementById('phase-name').textContent=phase.name;
  document.getElementById('phase-name').style.color=phase.color;
  document.getElementById('phase-note').textContent=phase.note;
}

// ── TAB SWITCH ────────────────────────────────────────────────────────────────
function switchTab(tab,skip){
  currentTab=tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('visible'));
  document.querySelectorAll('.bn-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('v-'+tab).classList.add('visible');
  document.getElementById('bn-'+tab).classList.add('active');
  document.getElementById('scroll').scrollTop=0;
  if(tab==='today'){browseWeekIdx=getCurrentWeekIdx();renderToday();}
  if(tab==='calendar')renderCalendar();
  if(tab==='week'&&!skip)renderWeekDetail();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderHeader();
renderToday();
renderCalendar();
</script>
</body>
</html>
